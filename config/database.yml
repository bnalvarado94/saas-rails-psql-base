default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  database: saas_rails_psql_base_development

test:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  database: saas_rails_psql_base_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
