# Purpose: CI pipeline — security scan, lint, test with coverage.
# Cancel in-progress runs on the same branch to save runner minutes.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Security scan (Brakeman)
        env:
          SECRET_KEY_BASE: ci_dummy_secret_key_base_for_brakeman_scan
        run: bin/brakeman --no-pager

      - name: Dependency audit (bundler-audit)
        run: bundle exec bundle-audit check --update

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint (RuboCop)
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    needs: [scan_ruby, lint]

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost/saas_test
      RAILS_ENV: test
      SECRET_KEY_BASE: thisisafakesecretforcionly1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup database
        run: |
          bin/rails db:prepare
          bin/rails runner "load 'db/queue_schema.rb'"

      - name: Run tests with coverage
        run: bundle exec rspec --require rails_helper

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
