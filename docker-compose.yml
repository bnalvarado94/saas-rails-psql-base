# Purpose: Development-oriented Docker Compose setup.
# Includes web server, background worker, and test runner.
# For production, use the Dockerfile directly or a container orchestrator.
#
# Gem installation — two supported workflows:
#   1. Baked into the image (default): `docker compose build`
#      Run this whenever you want a fully self-contained image or after major
#      Gemfile changes that you want baked in permanently.
#
#   2. Installed at runtime into the named volume:
#        docker compose run --rm web bundle install
#      Gems land in the bundle_data volume mounted at /usr/local/bundle and
#      persist across `docker compose run --rm ...` commands. Useful for quickly
#      adding a gem without rebuilding the image.
#
# Both workflows coexist: the volume takes precedence over the image layer at
# /usr/local/bundle, so a `bundle install` via workflow 2 will shadow the
# image-baked gems for all services until the volume is removed.
#
# Dev builds pass BUNDLE_WITHOUT="" so all gems (including dev/test) are installed.

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        # Install ALL gems in dev so rspec/rubocop/etc. are available in the container
        BUNDLE_WITHOUT: ""
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: ["bundle", "exec", "rake", "solid_queue:start"]
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"

  test:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: ["bash", "-c", "bundle exec rails db:create db:schema:load && bundle exec rspec"]
    profiles:
      - test
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.test

volumes:
  postgres_data:
  bundle_data:  # Bundler gem cache — survives container teardown, shared across web/worker/test
